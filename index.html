<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yaring TOS v.Full-Bracket</title>
    <style>
        :root { --p: #001a68; --s: #ff5722; --live: #ff0000; --success: #2e7d32; --bg: #f0f2f5; --gold: #ffd700; }
        body { font-family: 'Kanit', sans-serif; margin: 0; background: var(--bg); color: #333; }
        .header { background: var(--p); color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
        .container { padding: 15px; max-width: 800px; margin: auto; }
        .card { background: white; padding: 20px; border-radius: 18px; box-shadow: 0 6px 20px rgba(0,0,0,0.06); margin-bottom: 15px; border-top: 6px solid var(--p); }
        .fixture { padding: 15px; border-radius: 12px; background: #fff; margin-bottom: 10px; border: 1px solid #eee; }
        .score-btn { width: 45px; height: 45px; font-size: 1.2rem; font-weight: bold; border-radius: 50%; border: 1px solid #ddd; background: white; }
        .tab-btn { flex: 1; padding: 12px; border: none; background: #ddd; font-weight: bold; border-radius: 10px; cursor: pointer; }
        .tab-btn.active { background: var(--p); color: white; }
        .placeholder-team { color: #aaa; font-style: italic; }
        .champ-area { background: linear-gradient(135deg, #ffd700, #ff8c00); color: #000; text-align: center; padding: 25px; border-radius: 18px; margin-bottom: 20px; border: 3px dashed #fff; }
        .hidden { display: none !important; }
        .admin-only { display: none !important; }
        body[data-role="admin"] .admin-only { display: block !important; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px 5px; text-align: center; border-bottom: 1px solid #eee; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;500;600&display=swap" rel="stylesheet">
</head>
<body data-role="user">

<div class="header">
    <div>
        <div style="font-weight: 600;">สช.อ.ยะหริ่ง TOS</div>
        <div id="net-status" style="font-size: 0.7rem;">● Online</div>
    </div>
    <div onclick="auth()" style="cursor:pointer; background:rgba(255,255,255,0.2); padding:5px 12px; border-radius:15px; font-size: 0.8rem;">
        👤 <span id="role-txt">โหมดผู้ชม</span>
    </div>
</div>

<div class="container">
    <div id="champion-win" class="champ-area">
        <div style="font-size: 0.9rem; font-weight: bold;">🏆 CHAMPION 🏆</div>
        <div id="champ-name" style="font-size: 1.8rem; font-weight: 600; margin-top: 5px;">(รอผลการแข่งขัน)</div>
    </div>

    <div class="card" style="border-top-color: var(--live);">
        <h4 style="margin: 0 0 15px 0;">🏁 รอบ Knockout & Final</h4>
        <div id="ko-content">
            <div id="ko-list">
                <div style="text-align:center; padding:20px; color:#999;">กำลังโหลดตารางการแข่งขัน...</div>
            </div>
        </div>
    </div>

    <div style="display:flex; gap:10px; margin-bottom:15px;">
        <button class="tab-btn active" id="tA" onclick="tab('A')">สาย A</button>
        <button class="tab-btn" id="tB" onclick="tab('B')">สาย B</button>
    </div>

    <div id="viewA">
        <div class="card">
            <h4 style="margin:0 0 10px 0;">📊 ตารางคะแนน สาย A</h4>
            <table id="tblA"><thead><tr><th style="text-align:left">ทีม</th><th>แข่ง</th><th>+/-</th><th>แต้ม</th></tr></thead><tbody></tbody></table>
        </div>
        <div id="listA"></div>
    </div>

    <div id="viewB" class="hidden">
        <div class="card">
            <h4 style="margin:0 0 10px 0;">📊 ตารางคะแนน สาย B</h4>
            <table id="tblB"><thead><tr><th style="text-align:left">ทีม</th><th>แข่ง</th><th>+/-</th><th>แต้ม</th></tr></thead><tbody></tbody></table>
        </div>
        <div id="listB"></div>
    </div>

    <div id="admin-setup" class="card admin-only">
        <h4>⚙️ ตั้งค่าทัวร์นาเมนต์</h4>
        <div id="selectors" style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;"></div>
        <button onclick="launchTournament()" style="width:100%; padding:15px; background:var(--success); color:white; border:none; border-radius:10px; margin-top:15px; font-weight:bold;">สร้างตารางแข่ง 🏁</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, doc, setDoc, onSnapshot, runTransaction, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyADq4d5bpQyM7OpdVqkGSdVfPcWqjFyZS0",
        authDomain: "yaring-football-7s.firebaseapp.com",
        projectId: "yaring-football-7s",
        storageBucket: "yaring-football-7s.firebasestorage.app",
        messagingSenderId: "355947723335",
        appId: "1:355947723335:web:d8b3dbbbda5a0610e2cf62"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const docRef = doc(db, "tournaments", "yaring_ultimate_final");

    let state = { started: false, fixtures: [], knockout: [] };

    window.auth = () => {
        const p = prompt("รหัสผ่าน:");
        if(p === "admin123") document.body.setAttribute('data-role', 'admin');
        else if(p === "staff123") document.body.setAttribute('data-role', 'staff');
        document.getElementById('role-txt').innerText = document.body.getAttribute('data-role');
        updateUI();
    };

    window.launchTournament = async () => {
        const selects = document.querySelectorAll('.t-in');
        const vals = Array.from(selects).map(s => s.value);
        if(vals.includes("")) return alert("กรุณาเลือกทีมให้ครบ");
        
        const f = []; // (โค้ดสร้าง Fixtures เหมือนเดิม)
        const ko = [
            { id:'SF1', n:'รอบรองฯ 1', h:'ที่ 1 สาย A', a:'ที่ 2 สาย B', hS:0, aS:0, p:false, isPlaceholder: true },
            { id:'SF2', n:'รอบรองฯ 2', h:'ที่ 1 สาย B', a:'ที่ 2 สาย A', hS:0, aS:0, p:false, isPlaceholder: true },
            { id:'FINAL', n:'รอบชิงชนะเลิศ', h:'ผู้ชนะ SF1', a:'ผู้ชนะ SF2', hS:0, aS:0, p:false, isPlaceholder: true }
        ];
        await setDoc(docRef, { started: true, groupA: vals.slice(0,5), groupB: vals.slice(5,10), fixtures: [], knockout: ko });
    };

    function updateUI() {
        if(!state.knockout || state.knockout.length === 0) return;

        // แสดงรอบ Knockout
        document.getElementById('ko-list').innerHTML = state.knockout.map(f => `
            <div class="fixture">
                <div style="font-size:0.7rem; color:red; font-weight:bold; margin-bottom:5px;">${f.n}</div>
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <div style="flex:1" class="${f.isPlaceholder?'placeholder-team':''}"><b>${f.h}</b></div>
                    <div style="display:flex; gap:10px; align-items:center;">
                        <button class="score-btn" onclick="modScore('${f.id}','h',1,true)">${f.hS}</button>
                        <span>-</span>
                        <button class="score-btn" onclick="modScore('${f.id}','a',1,true)">${f.aS}</button>
                    </div>
                    <div style="flex:1; text-align:right;" class="${f.isPlaceholder?'placeholder-team':''}"><b>${f.a}</b></div>
                </div>
            </div>
        `).join('');

        // อัปเดตแชมป์
        const fin = state.knockout.find(x => x.id === 'FINAL');
        if(fin && fin.locked) {
            const winner = fin.hS > fin.aS ? fin.h : fin.a;
            document.getElementById('champ-name').innerText = winner;
            document.getElementById('champion-win').style.background = "linear-gradient(135deg, #ffd700, #fff)";
        }
    }

    onSnapshot(docRef, (snap) => { if(snap.exists()) { state = snap.data(); updateUI(); } });
    window.tab = (g) => {
        document.getElementById('viewA').classList.toggle('hidden', g!=='A');
        document.getElementById('viewB').classList.toggle('hidden', g!=='B');
        document.getElementById('tA').classList.toggle('active', g==='A');
        document.getElementById('tB').classList.toggle('active', g==='B');
    };
</script>
</body>
</html>
